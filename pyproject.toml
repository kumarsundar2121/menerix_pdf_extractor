[project]
name = "pdf_extractor"
version = "0.1.0"
description = "PDF extractor tool"
readme = "README.txt"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber==0.11.0",
    "pdf2image==1.17.0",
    "pytesseract==0.3.13",
    "numpy==1.26.3",
    "pandas==2.2.3"
]

[tool.vercel]
entrypoint = "api.extract:handler"
